# ===== Parâmetros do baseline (E1) =====
# Valores marcados com PLACEHOLDER são provisórios: calibrados mais tarde (prioridade 4).
seed: 42
replications: 30

# Tempo  (t = 0 é o fim do jogo)
time:
  tick_minutes: 0.5         # 1 passo = 30 segundos
  start_min: -60            # começa 1 h antes do fim do jogo (a cidade a funcionar normalmente)
  end_min: 120              # acaba 2 h depois do fim do jogo

# Mundo abstrato (cidade em grelha, estádio no centro)
world:
  width: 41
  height: 41
  cell_km: 0.25             # 1 célula = 250 m  →  carro a 30 km/h anda 1 célula por passo
  min_trip_cells: 6         # destino a pelo menos 6 células da origem
  event_zone_radius: 3      # zona do evento = até 3 células do estádio

# Procura (passageiros)
demand:
  city_rate_per_min: 5      # PLACEHOLDER: procura normal, na cidade toda, o tempo todo
  event:
    enabled: true           # false = dia normal (E0)
    peak_rate_per_min: 20   # PLACEHOLDER: ritmo máximo do pico no estádio
    ramp_up_min: 10         # sobe de 0 ao máximo em 10 min depois do fim do jogo
    duration_min: 60        # volta a 0 aos 60 min
  patience_mean_min: 10     # PLACEHOLDER (pressuposto)
  patience_max_min: 30      # limita a cauda da exponencial

# Oferta (carros)
supply:
  n_vehicles: 150           # PLACEHOLDER: mínimo para E0 ter < 5% de desistências é ~120; +25% de folga
  initial_radius_cells: 40  # 40 = espalhados pela cidade toda

# Política ativa (baseline: matching imediato, sem reposicionamento)
policy:
  matching: immediate       # immediate | batch
  batch_window_ticks: 2     # janela do lote: 2 passos = 1 min
  relocation:
    enabled: false
    cap_pct: null           # limite X (% da frota); null = sem limite
    lead_min: 15            # quantos minutos antes do fim do jogo

# KPIs
kpi:
  emission_kg_co2_per_km: 0.15   # PLACEHOLDER: precisa de fonte citada