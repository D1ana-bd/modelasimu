# Parâmetros gerais da simulação
seed: 42
replications: 30
horizon_min: 120          # minutos simulados após o fim do jogo

# Política ativa
policy:
  matching: immediate     # immediate | batch
  batch_window_s: 30
  pooling: false
  relocation: false

# Valores provisórios (substituídos pelos dados reais)
placeholder:
  request_rate_per_min: 20
  request_duration_min: 60
  patience_mean_min: 15
  travel_time_min: 5            # entre zonas diferentes
  travel_time_same_zone_min: 2  # dentro da mesma zona
  speed_kmh: 20                 # para converter tempo em km
  n_vehicles: 50
  stadium_zone: 1               # IDs de zona fictícios por agora
  nearby_zones: [2, 3, 4]
  destination_zones: [10, 11, 12, 13, 14]

  # Parâmetros usados no cálculo dos KPIs
  kpi:
    emission_kg_co2_per_km: 0.15  # pressuposto a justificar no relatório